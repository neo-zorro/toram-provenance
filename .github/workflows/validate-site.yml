name: Validate TORAM Provenance Site

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - 404.html
      - src/**
      - .github/workflows/validate-site.yml
  pull_request:
    paths:
      - index.html
      - 404.html
      - src/**
      - .github/workflows/validate-site.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile Tailwind CSS
        run: |
          npm install --no-save tailwindcss@4.3.3 @tailwindcss/cli@4.3.3
          mkdir -p _site
          cp index.html 404.html _site/
          npx @tailwindcss/cli -i ./src/input.css -o ./_site/styles.css --minify

      - name: Validate site artifact
        run: |
          test -s _site/index.html
          test -s _site/404.html
          test -s _site/styles.css
          grep -Fq "TORAM — Working Financial AI Runtime" _site/index.html
          grep -Fq "WORKING FINANCIAL AI RUNTIME" _site/index.html
          grep -Fq "CURRENT PROOF" _site/index.html
          grep -Fq "THE SCALE PATH" _site/index.html
          grep -Fq "repeatable financial-runtime product" _site/index.html
          grep -Fq "not proprietary trading capital" _site/index.html
          ! grep -Fq "WEATHER + CLIMATE RESPONSE" _site/index.html
          ! grep -Fq "SPORTS + ATHLETE INTELLIGENCE" _site/index.html
          ! grep -Fq "LOGISTICS + SUPPLY NETWORKS" _site/index.html
          ! grep -Fq "AGROTECH + FARM OPERATIONS" _site/index.html
          ! grep -Fq "TORAM-MAIN" _site/index.html
          ! grep -Fq "TORAM-Market-Recorder" _site/index.html
          grep -q "\\.bg-slate-950" _site/styles.css
          echo "Simplified TORAM investor site artifact validated."
