name: Validate TORAM Provenance Site

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - 404.html
      - src/**
      - .github/workflows/validate-site.yml
  pull_request:
    paths:
      - index.html
      - 404.html
      - src/**
      - .github/workflows/validate-site.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile Tailwind CSS
        run: |
          npm install --no-save tailwindcss@4.3.3 @tailwindcss/cli@4.3.3
          mkdir -p _site
          cp index.html 404.html _site/
          npx @tailwindcss/cli -i ./src/input.css -o ./_site/styles.css --minify

      - name: Validate site artifact
        run: |
          test -s _site/index.html
          test -s _site/404.html
          test -s _site/styles.css
          grep -Fq "SEARCH FOUND INFORMATION. THE NEXT QUESTION IS AUTHORITY." _site/index.html
          grep -Fq "Show me why I should trust it." _site/index.html
          grep -Fq "AUTHORITY IS DIFFERENT FROM RANKING" _site/index.html
          grep -Fq "Popular is not the same as true. Repeated is not the same as independent." _site/index.html
          grep -Fq "HUMAN PROOF SHOULD BE VISIBLE" _site/index.html
          grep -Fq "I BUILT THIS" _site/index.html
          grep -Fq "I USED THIS" _site/index.html
          grep -Fq "I VERIFIED THIS" _site/index.html
          grep -Fq "I SAW IT FAIL" _site/index.html
          grep -Fq "I COMMERCIALIZED THIS" _site/index.html
          grep -Fq "Investigate authority. Do not invent it." _site/index.html
          grep -Fq "FROM SEARCH RESULT TO LIVING ANSWER" _site/index.html
          grep -Fq "PROVING IT, NOT PROMISING IT" _site/index.html
          grep -Fq "Authority should be inspectable." _site/index.html
          ! grep -Fiq "BANKNIFTY" _site/index.html
          ! grep -Fiq "NIFTY" _site/index.html
          ! grep -Fiq "finance" _site/index.html
          ! grep -Fiq "financial" _site/index.html
          ! grep -Fiq "trading" _site/index.html
          ! grep -Fiq "broker" _site/index.html
          ! grep -Fq "INVESTOR DILIGENCE" _site/index.html
          ! grep -Fq "Investors" _site/index.html
          ! grep -Fq "SEED" _site/index.html
          ! grep -Fq "BUSINESS MODEL" _site/index.html
          ! grep -Fq "PRE-SEED" _site/index.html
          ! grep -Fq "€1.5M" _site/index.html
          ! grep -Fq "TORAM-MAIN" _site/index.html
          ! grep -Fq "TORAM-Market-Recorder" _site/index.html
          ! grep -Fq "CloudExecution" _site/index.html
          ! grep -Fq "WebSocket" _site/index.html
          ! grep -Fq "WAL" _site/index.html
          ! grep -Fq "HMAC" _site/index.html
          ! grep -Fq "QuestDB" _site/index.html
          grep -q "\\.bg-slate-950" _site/styles.css
          echo "Public site validated as authority-first, domain-neutral, non-investor and non-technical."
