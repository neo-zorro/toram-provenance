name: Validate TORAM Provenance Site

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - 404.html
      - src/**
      - .github/workflows/validate-site.yml
  pull_request:
    paths:
      - index.html
      - 404.html
      - src/**
      - .github/workflows/validate-site.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile Tailwind CSS
        run: |
          npm install --no-save tailwindcss@4.3.3 @tailwindcss/cli@4.3.3
          mkdir -p _site
          cp index.html 404.html _site/
          npx @tailwindcss/cli -i ./src/input.css -o ./_site/styles.css --minify

      - name: Validate site artifact
        run: |
          test -s _site/index.html
          test -s _site/404.html
          test -s _site/styles.css
          grep -Fq "FINANCIAL-MARKET INTELLIGENT INFRASTRUCTURE" _site/index.html
          grep -Fq "Start with one instrument." _site/index.html
          grep -Fq "START SIMPLE" _site/index.html
          grep -Fq "THE JUNCTION" _site/index.html
          grep -Fq "State gate" _site/index.html
          grep -Fq "Logic gate" _site/index.html
          grep -Fq "Safety gate" _site/index.html
          grep -Fq "Action gate" _site/index.html
          grep -Fq "ONE DEFINITION, THREE MODES" _site/index.html
          grep -Fq "REPLAY" _site/index.html
          grep -Fq "LIVE PAPER" _site/index.html
          grep -Fq "LIVE EXECUTION" _site/index.html
          grep -Fq "WHY NOT A FREE BACKTESTER?" _site/index.html
          grep -Fq "The consumer wedge is not" _site/index.html
          grep -Fq "WHO TORAM IS FOR" _site/index.html
          grep -Fq "SELF-DIRECTED USER" _site/index.html
          grep -Fq "ADVANCED SYSTEMATIC TRADER" _site/index.html
          grep -Fq "PROFESSIONAL DESK" _site/index.html
          grep -Fq "INSTITUTIONAL FUND / BROKER" _site/index.html
          grep -Fq "THE GTM WEDGE" _site/index.html
          grep -Fq "THE VISION" _site/index.html
          grep -Fq "One runtime from personal strategy testing to institutional production assurance." _site/index.html
          ! grep -Fq "CURRENT INTERNAL ENGINEERING PROOF" _site/index.html
          ! grep -Fq "74,519" _site/index.html
          ! grep -Fq "18 / 18" _site/index.html
          ! grep -Fq "53 / 53" _site/index.html
          ! grep -Fq "39 / 39" _site/index.html
          ! grep -Fq "Top schools in Chennai" _site/index.html
          ! grep -Fq "INVESTOR DILIGENCE" _site/index.html
          ! grep -Fq "PRE-SEED" _site/index.html
          ! grep -Fq "BUSINESS MODEL" _site/index.html
          ! grep -Fq "TORAM-MAIN" _site/index.html
          ! grep -Fq "TORAM-Market-Recorder" _site/index.html
          ! grep -Fq "CloudExecution" _site/index.html
          ! grep -Fq "WebSocket" _site/index.html
          ! grep -Fq "HMAC" _site/index.html
          ! grep -Fq "QuestDB" _site/index.html
          grep -q "\\.bg-slate-950" _site/styles.css
          echo "Public site validated as consumer-to-institutional financial-market infrastructure, non-investor and implementation-safe."
