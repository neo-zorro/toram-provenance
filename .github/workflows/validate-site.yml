name: Validate TORAM Provenance Site

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - 404.html
      - src/**
      - .github/workflows/validate-site.yml
  pull_request:
    paths:
      - index.html
      - 404.html
      - src/**
      - .github/workflows/validate-site.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile Tailwind CSS
        run: |
          npm install --no-save tailwindcss@4.3.3 @tailwindcss/cli@4.3.3
          mkdir -p _site
          cp index.html 404.html _site/
          npx @tailwindcss/cli -i ./src/input.css -o ./_site/styles.css --minify

      - name: Validate site artifact
        run: |
          test -s _site/index.html
          test -s _site/404.html
          test -s _site/styles.css
          grep -Fq "THE ANSWER SHOULD HAVE TO PROVE ITSELF" _site/index.html
          grep -Fq "An answer should not win because it ranked first." _site/index.html
          grep -Fq "Reach is not authority." _site/index.html
          grep -Fq "THE AUTHORITY CYCLE" _site/index.html
          grep -Fq "Build the system that makes the claim earn its authority." _site/index.html
          grep -Fq "THE AUTHORITY LAYER" _site/index.html
          grep -Fq "Do not own truth. Own the proof that lets people judge it." _site/index.html
          grep -Fq "REVIEWS" _site/index.html
          grep -Fq "PRODUCT CLAIMS" _site/index.html
          grep -Fq "POSTS & MESSAGES" _site/index.html
          grep -Fq "IMAGES & VIDEO" _site/index.html
          grep -Fq "AI NARRATIVES" _site/index.html
          grep -Fq "The moat is the authority graph." _site/index.html
          grep -Fq "What are the top schools in Chennai?" _site/index.html
          grep -Fq "AI DOES THE HEAVY LIFTING. EVIDENCE EARNS THE AUTHORITY." _site/index.html
          grep -Fq "Reach can spread a claim. Only evidence should strengthen its authority." _site/index.html
          ! grep -Fiq "BANKNIFTY" _site/index.html
          ! grep -Fiq "NIFTY" _site/index.html
          ! grep -Fiq "finance" _site/index.html
          ! grep -Fiq "financial" _site/index.html
          ! grep -Fiq "trading" _site/index.html
          ! grep -Fiq "broker" _site/index.html
          ! grep -Fq "INVESTOR DILIGENCE" _site/index.html
          ! grep -Fq "Investors" _site/index.html
          ! grep -Fq "SEED" _site/index.html
          ! grep -Fq "BUSINESS MODEL" _site/index.html
          ! grep -Fq "PRE-SEED" _site/index.html
          ! grep -Fq "TORAM-MAIN" _site/index.html
          ! grep -Fq "TORAM-Market-Recorder" _site/index.html
          ! grep -Fq "CloudExecution" _site/index.html
          ! grep -Fq "WebSocket" _site/index.html
          ! grep -Fq "WAL" _site/index.html
          ! grep -Fq "HMAC" _site/index.html
          ! grep -Fq "QuestDB" _site/index.html
          grep -q "\\.bg-slate-950" _site/styles.css
          echo "Public site validated as authority-layer, domain-neutral, non-investor and non-technical."
