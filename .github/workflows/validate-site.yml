name: Validate TORAM Provenance Site

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - 404.html
      - src/**
      - .github/workflows/validate-site.yml
  pull_request:
    paths:
      - index.html
      - 404.html
      - src/**
      - .github/workflows/validate-site.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile Tailwind CSS
        run: |
          npm install --no-save tailwindcss@4.3.3 @tailwindcss/cli@4.3.3
          mkdir -p _site
          cp index.html 404.html _site/
          npx @tailwindcss/cli -i ./src/input.css -o ./_site/styles.css --minify

      - name: Validate site artifact
        run: |
          test -s _site/index.html
          test -s _site/404.html
          test -s _site/styles.css
          grep -Fq "TORAM — What if software could appear when you need it?" _site/index.html
          grep -Fq "A GLIMPSE OF WHAT MAY COME NEXT" _site/index.html
          grep -Fq "THE IDEA" _site/index.html
          grep -Fq "YOUR JOURNEY" _site/index.html
          grep -Fq "ONE IDEA. MANY WORLDS." _site/index.html
          grep -Fq "THE HUMAN STAYS IN CONTROL" _site/index.html
          grep -Fq "COMING SOON" _site/index.html
          grep -Fq "Describe it. Use it. Decide whether it deserves to stay." _site/index.html
          ! grep -Fq "INVESTOR DILIGENCE" _site/index.html
          ! grep -Fq "Investors" _site/index.html
          ! grep -Fq "SEED" _site/index.html
          ! grep -Fq "BUSINESS MODEL" _site/index.html
          ! grep -Fq "PRE-SEED" _site/index.html
          ! grep -Fq "€1.5M" _site/index.html
          ! grep -Fq "TORAM-MAIN" _site/index.html
          ! grep -Fq "TORAM-Market-Recorder" _site/index.html
          ! grep -Fq "CloudExecution" _site/index.html
          ! grep -Fq "WebSocket" _site/index.html
          ! grep -Fq "WAL" _site/index.html
          ! grep -Fq "HMAC" _site/index.html
          ! grep -Fq "QuestDB" _site/index.html
          grep -q "\\.bg-slate-950" _site/styles.css
          echo "Public TORAM site validated as a simple, non-investor, non-technical narrative."
