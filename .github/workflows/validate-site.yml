name: Validate TORAM Provenance Site

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - 404.html
      - src/**
      - .github/workflows/validate-site.yml
  pull_request:
    paths:
      - index.html
      - 404.html
      - src/**
      - .github/workflows/validate-site.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile Tailwind CSS
        run: |
          npm install --no-save tailwindcss@4.3.3 @tailwindcss/cli@4.3.3
          mkdir -p _site
          cp index.html 404.html _site/
          npx @tailwindcss/cli -i ./src/input.css -o ./_site/styles.css --minify

      - name: Validate site artifact
        run: |
          test -s _site/index.html
          test -s _site/404.html
          test -s _site/styles.css
          grep -Fq "TORAM — Governed Financial Runtime" _site/index.html
          grep -Fq "WORKING FINANCIAL RUNTIME" _site/index.html
          grep -Fq "CURRENT PROOF" _site/index.html
          grep -Fq "CAPABILITIES" _site/index.html
          grep -Fq "THE SCALE PATH" _site/index.html
          grep -Fq "Broker-linked execution exercised" _site/index.html
          ! grep -Fq "INVESTOR DILIGENCE" _site/index.html
          ! grep -Fq "Investors" _site/index.html
          ! grep -Fq "WHAT SEED CAPITAL BUILDS" _site/index.html
          ! grep -Fq "Seed productization" _site/index.html
          ! grep -Fq "THE FIRST COMMERCIAL WEDGE" _site/index.html
          ! grep -Fq "BUSINESS MODEL" _site/index.html
          ! grep -Fq "PRE-SEED" _site/index.html
          ! grep -Fq "€1.5M" _site/index.html
          ! grep -Fq "18–24 months" _site/index.html
          ! grep -Fq "This funding round" _site/index.html
          ! grep -Fq "TORAM-MAIN" _site/index.html
          ! grep -Fq "TORAM-Market-Recorder" _site/index.html
          grep -q "\\.bg-slate-950" _site/styles.css
          echo "Public TORAM site validated as product/technology narrative only."
