name: Validate TORAM Provenance Site

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - 404.html
      - src/**
      - .github/workflows/validate-site.yml
  pull_request:
    paths:
      - index.html
      - 404.html
      - src/**
      - .github/workflows/validate-site.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile Tailwind CSS
        run: |
          npm install --no-save tailwindcss@4.3.3 @tailwindcss/cli@4.3.3
          mkdir -p _site
          cp index.html 404.html _site/
          npx @tailwindcss/cli -i ./src/input.css -o ./_site/styles.css --minify

      - name: Validate site artifact
        run: |
          test -s _site/index.html
          test -s _site/404.html
          test -s _site/styles.css
          grep -Fq "FINANCIAL-MARKET INTELLIGENT INFRASTRUCTURE" _site/index.html
          grep -Fq "Trading intelligence is only useful if" _site/index.html
          grep -Fq "production behaves as intended." _site/index.html
          grep -Fq "THE PRODUCTION GAP" _site/index.html
          grep -Fq "THE TORAM PRODUCT LAYER" _site/index.html
          grep -Fq "WHY NOT A FREE BACKTESTER?" _site/index.html
          grep -Fq "TORAM starts where the backtest stops." _site/index.html
          grep -Fq "Canonical causal state" _site/index.html
          grep -Fq "Same decision path" _site/index.html
          grep -Fq "Live/replay forensic parity" _site/index.html
          grep -Fq "Fail-closed external action" _site/index.html
          grep -Fq "74,519" _site/index.html
          grep -Fq "18 / 18" _site/index.html
          grep -Fq "53 / 53" _site/index.html
          grep -Fq "39 / 39" _site/index.html
          grep -Fq "QUANT & PROP DESKS" _site/index.html
          grep -Fq "ALGO PROVIDERS" _site/index.html
          grep -Fq "BROKERS & TRADING TECH" _site/index.html
          grep -Fq "THE VISION" _site/index.html
          grep -Fq "Make production assurance a standard layer of algorithmic and AI trading." _site/index.html
          ! grep -Fq "Top schools in Chennai" _site/index.html
          ! grep -Fq "The moat is the authority graph" _site/index.html
          ! grep -Fq "I COMMERCIALIZED THIS" _site/index.html
          ! grep -Fq "INVESTOR DILIGENCE" _site/index.html
          ! grep -Fq "PRE-SEED" _site/index.html
          ! grep -Fq "BUSINESS MODEL" _site/index.html
          ! grep -Fq "TORAM-MAIN" _site/index.html
          ! grep -Fq "TORAM-Market-Recorder" _site/index.html
          ! grep -Fq "CloudExecution" _site/index.html
          ! grep -Fq "WebSocket" _site/index.html
          ! grep -Fq "HMAC" _site/index.html
          ! grep -Fq "QuestDB" _site/index.html
          grep -q "\\.bg-slate-950" _site/styles.css
          echo "Public site validated as financial-market intelligent infrastructure, production-assurance led, non-investor and implementation-safe."
