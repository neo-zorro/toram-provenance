name: Deploy TORAM Provenance

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - 404.html
      - src/**
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build Tailwind CSS
        run: |
          mkdir -p _site
          cp index.html 404.html _site/
          npx --yes @tailwindcss/cli@4 -i ./src/input.css -o ./_site/styles.css --minify

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
